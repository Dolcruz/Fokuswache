name: Windows installer

on:
  push:
    branches: [main, codex/windows-installer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python tools/check.py
      - name: Build application
        shell: pwsh
        run: ./Bauen.ps1
      - name: Package installer, notices and sources
        shell: pwsh
        run: ./Paketieren.ps1
      - name: Installation, update and uninstallation tests
        shell: powershell
        run: ./tests/test_installer.ps1 -SetupPath ./dist/FokusWache-Setup-1.0.0-x64.exe
      - name: Upload verified installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*
          compression-level: 0
          retention-days: 7
      - name: Upload installation test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-test-logs
          path: build/installer-test/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
